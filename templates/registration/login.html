{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Bem-vindo de volta</h1>
            <p class="auth-subtitle">Insira as suas credenciais para aceder à sua conta.</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Email ou Nome de Utilizador</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" required id="id_username" placeholder="exemplo@email.com">
            </div>

            <div class="form-group">
                <label for="id_password">Palavra-passe</label>
                <input type="password" name="password" autocomplete="current-password" required id="id_password" placeholder="••••••••">
                <div class="password-toggle" onclick="togglePassword('id_password', this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember"> Lembrar-me
                </label>
                <a href="#" class="forgot-link">Esqueceu-se da palavra-passe?</a>
            </div>

            <button type="submit" class="btn-auth">Iniciar Sessão</button>
        </form>

        <div class="auth-footer">
            Não tem uma conta? <a href="{% url 'register' %}">Criar conta</a>
        </div>
    </div>
</div>

{% endblock %}
